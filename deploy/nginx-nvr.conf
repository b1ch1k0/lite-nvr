map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nvr;
    client_max_body_size 64k;
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8090/auth/stream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # go2rtc: only live websocket + snapshots, each checked against the user's camera rights
    # anonymous visitors get the same plain 404 everywhere — nothing reveals that a panel is here
    location @gone { return 404; }

    location = /api/ws {
        auth_request /_auth;
        error_page 401 403 = @gone;
        proxy_pass http://127.0.0.1:1984;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location = /api/frame.jpeg {
        auth_request /_auth;
        error_page 401 403 = @gone;
        proxy_pass http://127.0.0.1:1984;
    }
    location /api/ { return 404; }

    # recordings are served by nginx after the app checks rights (X-Accel-Redirect)
    location /_rec/ {
        internal;
        alias /srv/nvr/rec/;
        types { video/mp4 mp4; }
    }

    location /_ev/ {
        internal;
        alias /srv/nvr/events/;
        types { image/jpeg jpg; }
        expires 1h;
    }

    location /_poster/ {
        internal;
        alias /srv/nvr/posters/;
        types { image/jpeg jpg; }
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_intercept_errors on;
        error_page 404 = @gone;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
