{% extends "base.html" %}{% block title %}NVR{% endblock %}{% block body %}
<form class="card login" id="lf" autocomplete="on">
  <h2>● NVR — შესვლა</h2>
  <label>მომხმარებელი<input name="username" autocomplete="username" required autofocus></label>
  <label>პაროლი<input name="password" type="password" autocomplete="current-password" required></label>
  <button id="btn">შესვლა</button>
  <div id="m" class="small"></div>
</form>
<script>
// SHA-256 (WebCrypto is unavailable on plain-HTTP origins, so a small JS implementation is used)
const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
const enc = new TextEncoder(), W = new Uint32Array(64);
const ror = (x, n) => (x >>> n) | (x << (32 - n));
function sha256hex(str) {
  const b = enc.encode(str), n = ((b.length + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(b); m[b.length] = 0x80;
  const dv = new DataView(m.buffer), bits = b.length * 8;
  dv.setUint32(n - 4, bits >>> 0); dv.setUint32(n - 8, Math.floor(bits / 4294967296));
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  for (let i = 0; i < n; i += 64) {
    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const x = W[t - 15], y = W[t - 2];
      W[t] = (W[t - 16] + (ror(x, 7) ^ ror(x, 18) ^ (x >>> 3)) + W[t - 7] + (ror(y, 17) ^ ror(y, 19) ^ (y >>> 10))) | 0;
    }
    let a = h0, bb = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let t = 0; t < 64; t++) {
      const t1 = (h + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) | 0;
      const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + bb) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
    h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
  }
  return [h0, h1, h2, h3, h4, h5, h6, h7].map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
const NONCE = {{ nonce|tojson }}, PREFIX = {{ pow|tojson }};
// proof-of-work in small chunks so the page stays responsive
function solve() {
  return new Promise(res => {
    let c = 0;
    (function step() {
      for (let i = 0; i < 4000; i++, c++) if (sha256hex(NONCE + ':' + c).startsWith(PREFIX)) return res(c);
      setTimeout(step, 0);
    })();
  });
}
const pow = solve();   // start right away, usually done before the password is typed
const f = document.getElementById('lf'), m = document.getElementById('m'), btn = document.getElementById('btn');
f.onsubmit = async e => {
  e.preventDefault(); btn.disabled = true; m.className = 'small muted'; m.textContent = 'მოწმდება…';
  const c = await pow;
  const r = await fetch('/_/k', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({u: f.username.value, p: f.password.value, n: NONCE, c: String(c)})}).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : {};
  if (j.s === 'ok') { location = j.to; return; }
  m.className = 'err';
  m.textContent = j.s === 'locked' ? 'ძალიან ბევრი მცდელობა. სცადეთ 10 წუთში.'
               : j.s === 'denied' ? 'არასწორი სახელი ან პაროლი'
               : 'სესიას ვადა გაუვიდა — გვერდი განახლდება';
  if (!j.s || j.s === 'locked') { setTimeout(() => location.reload(), 1500); return; }
  setTimeout(() => location.reload(), 1200);  // a nonce is single-use: fetch a fresh one
};
</script>
{% endblock %}
